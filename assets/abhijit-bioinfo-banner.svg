<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Abhijit Swain — algorithms, omics and AI</title>
  <desc id="desc">A custom terminal-inspired banner with a blinking prompt and animated signals moving through a computational network graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090d18"/><stop offset="1" stop-color="#141d35"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop stop-color="#58f0c4"/><stop offset="1" stop-color="#74a8ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#93a9cc" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="22" fill="url(#grid)"/>
  <rect x="34" y="32" width="932" height="216" rx="16" fill="#0b1322" fill-opacity=".62" stroke="#7890b3" stroke-opacity=".18"/>
  <path d="M35 72H965" stroke="#7890b3" stroke-opacity=".18"/>
  <circle cx="58" cy="52" r="5" fill="#ff6b75"/><circle cx="77" cy="52" r="5" fill="#ffc857"/><circle cx="96" cy="52" r="5" fill="#56e39f"/>

  <g font-family="SFMono-Regular,Consolas,monospace">
    <text x="125" y="57" fill="#7185a5" font-size="12">abhijit / research-console</text>
    <text x="66" y="112" fill="#58f0c4" font-size="15">$ whoami</text>
    <text x="66" y="158" fill="#f4f6ff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">Abhijit Swain</text>
    <text x="68" y="190" fill="#c0cbe0" font-size="15">BIOINFORMATICS <tspan fill="#58f0c4">×</tspan> ALGORITHMS <tspan fill="#58f0c4">×</tspan> AI</text>
    <text x="66" y="224" fill="#8093b3" font-size="13">&gt; find patterns. build methods. make evidence useful.</text>
    <rect x="491" y="212" width="8" height="15" rx="1" fill="#58f0c4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M645 124L710 93L770 123L830 82L900 112" stroke="#6380a9" stroke-opacity=".7" stroke-width="2"/>
    <path d="M645 124L700 178L770 123L825 184L900 112" stroke="#6380a9" stroke-opacity=".7" stroke-width="2"/>
    <path d="M710 93L700 178M710 93L825 184M830 82L825 184M770 123L900 196" stroke="#6380a9" stroke-opacity=".45" stroke-width="2"/>
    <path d="M645 124L710 93L770 123L830 82L900 112" stroke="url(#signal)" stroke-width="2" stroke-dasharray="2 12" opacity=".95">
      <animate attributeName="stroke-dashoffset" from="0" to="-42" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M645 124L700 178L770 123L825 184L900 112" stroke="#c08bff" stroke-width="2" stroke-dasharray="2 14" opacity=".8">
      <animate attributeName="stroke-dashoffset" from="0" to="42" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle cx="645" cy="124" r="8" fill="#58f0c4"/><circle cx="710" cy="93" r="6" fill="#74a8ff"/>
    <circle cx="700" cy="178" r="6" fill="#c08bff"/><circle cx="770" cy="123" r="9" fill="#f0f4ff"/>
    <circle cx="830" cy="82" r="6" fill="#58f0c4"/><circle cx="825" cy="184" r="6" fill="#74a8ff"/>
    <circle cx="900" cy="112" r="8" fill="#c08bff"/><circle cx="900" cy="196" r="5" fill="#58f0c4"/>
  </g>
  <g filter="url(#glow)">
    <circle r="4" fill="#a8ffe7"><animateMotion dur="3.2s" repeatCount="indefinite" path="M645 124L710 93L770 123L830 82L900 112"/></circle>
    <circle r="4" fill="#dfc2ff"><animateMotion dur="3.8s" repeatCount="indefinite" path="M645 124L700 178L770 123L825 184L900 112"/></circle>
  </g>
</svg>
